[project]
name = "gravitee-stacker"
version = "0.1.0"
description = "MCP server that manages the Gravitee Gamma demo stack (thin wrapper over docker/run.sh)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zachary Sirotkin", email = "zachary.sirotkin@graviteesource.com" }]
keywords = ["mcp", "gravitee", "gamma", "docker", "devtools"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "mcp>=1.28.0",
]

[project.scripts]
gravitee-stacker = "gravitee_stacker.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gravitee_stacker"]

[tool.hatch.build.targets.wheel.force-include]
"gravitee_stacker/apim-compose.yml" = "gravitee_stacker/apim-compose.yml"
"gravitee_stacker/apim-license.yml" = "gravitee_stacker/apim-license.yml"
"gravitee_stacker/apim-kafka-compose.yml" = "gravitee_stacker/apim-kafka-compose.yml"
"gravitee_stacker/kafka" = "gravitee_stacker/kafka"
"gravitee_stacker/am-compose.yml" = "gravitee_stacker/am-compose.yml"
"gravitee_stacker/am-nginx.conf" = "gravitee_stacker/am-nginx.conf"
