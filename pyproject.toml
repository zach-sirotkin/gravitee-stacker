[project]
name = "gamma-stack-mcp"
version = "0.1.0"
description = "MCP server that manages the Gravitee Gamma demo stack (thin wrapper over docker/run.sh)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zachary Sirotkin", email = "zachary.sirotkin@graviteesource.com" }]
keywords = ["mcp", "gravitee", "gamma", "docker", "devtools"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "mcp>=1.28.0",
]

[project.scripts]
gamma-stack-mcp = "gamma_stack_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gamma_stack_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"gamma_stack_mcp/apim-compose.yml" = "gamma_stack_mcp/apim-compose.yml"
"gamma_stack_mcp/apim-license.yml" = "gamma_stack_mcp/apim-license.yml"
"gamma_stack_mcp/am-compose.yml" = "gamma_stack_mcp/am-compose.yml"
"gamma_stack_mcp/am-nginx.conf" = "gamma_stack_mcp/am-nginx.conf"
