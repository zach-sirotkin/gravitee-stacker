[project]
name = "gravitee-stacker"
version = "0.8.2"
description = "MCP server that stands up and manages local Gravitee Docker stacks (APIM incl. native-Kafka, Access Management, the Gamma demo, and any official quick-setup config) — any version, multiple at once."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "The Gravitee team", email = "zachary.sirotkin@graviteesource.com" }]
keywords = ["mcp", "gravitee", "apim", "access-management", "kafka", "gamma", "docker", "devtools"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    # Cap at <2: mcp 2.0 removed `mcp.server.fastmcp` (which this server imports). Without
    # the cap a fresh install resolves 2.0 and fails at import. Revisit if migrating to the
    # mcp 2.x server API.
    "mcp>=1.28.0,<2",
]

[project.urls]
Repository = "https://github.com/zach-sirotkin/gravitee-stacker"
Changelog = "https://github.com/zach-sirotkin/gravitee-stacker/blob/main/CHANGELOG.md"
Issues = "https://github.com/zach-sirotkin/gravitee-stacker/issues"

[project.scripts]
gravitee-stacker = "gravitee_stacker.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402", "E731", "E741"]  # line length, late imports, lambdas, ambiguous names

[tool.hatch.build.targets.wheel]
# packages includes ALL files under gravitee_stacker/ (composes, kafka certs/config,
# am nginx conf) — not just .py — so no force-include is needed.
packages = ["gravitee_stacker"]
artifacts = ["*.yml", "*.conf", "*.properties", "*.jks"]
