[project]
name = "gravitee-stacker"
version = "0.2.0"
description = "MCP server that stands up and manages local Gravitee Docker stacks (APIM incl. native-Kafka, Access Management, and the Gamma demo) — any version, multiple at once."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zachary Sirotkin", email = "zachary.sirotkin@graviteesource.com" }]
keywords = ["mcp", "gravitee", "apim", "access-management", "kafka", "gamma", "docker", "devtools"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "mcp>=1.28.0",
]

[project.scripts]
gravitee-stacker = "gravitee_stacker.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# packages includes ALL files under gravitee_stacker/ (composes, kafka certs/config,
# am nginx conf) — not just .py — so no force-include is needed.
packages = ["gravitee_stacker"]
artifacts = ["*.yml", "*.conf", "*.properties", "*.jks"]
