# Feature overlay: Gravitee Alert Engine (AE). **EE — requires a license.**
#   docker compose -f apim-compose.yml -f apim-feature-alert-engine.yml up -d
#
# Adds an alert-engine service on the shared `storage` network and wires the gateway +
# management-api AE connector to it CONTAINER-TO-CONTAINER: ws_discovery=false and the
# endpoint pointed at the service name (http://apim-alert-engine:8072/). This is exactly
# what the upstream ee-with-alert-engine quick-setup can't do — there AE has NO networks
# key (isolated on the default net) and ws_discovery=true makes the gateway chase AE's
# announced, unroutable container IP after a host.docker.internal bootstrap, so events
# never actually reach AE. On the curated stack (storage/frontend nets) this just works.
#
# AE_VERSION is auto-selected from the APIM version (apim.ae_version_for) so the engine
# matches the gateway's bundled alert-engine-connectors-ws; override with AE_VERSION.
services:
  apim-gateway:
    environment:
      - gravitee_alerts_alert-engine_enabled=true
      - gravitee_alerts_alert-engine_ws_discovery=false
      - gravitee_alerts_alert-engine_ws_endpoints[0]=http://apim-alert-engine:8072/
      - gravitee_alerts_alert-engine_ws_security_username=admin
      - gravitee_alerts_alert-engine_ws_security_password=adminadmin

  apim-management-api:
    environment:
      - gravitee_alerts_alert-engine_enabled=true
      - gravitee_alerts_alert-engine_ws_discovery=false
      - gravitee_alerts_alert-engine_ws_endpoints[0]=http://apim-alert-engine:8072/
      - gravitee_alerts_alert-engine_ws_security_username=admin
      - gravitee_alerts_alert-engine_ws_security_password=adminadmin

  apim-alert-engine:
    image: graviteeio/ae-engine:${AE_VERSION:-3}
    restart: always
    networks: [storage]
    environment:
      # AE's node/management API binds to 127.0.0.1 by default → publishing the port hits
      # nothing. Bind it to all interfaces so ae_log_level / ae_trigger_dump can reach it.
      - gravitee_services_core_http_host=0.0.0.0
    ports:
      # AE node/management API — ALL endpoints are under /_node (admin/adminadmin), e.g.
      # /_node/logging, /_node/triggers. Used by ae_log_level / ae_trigger_dump. Shifts
      # with the instance offset for coexist.
      - "${APIM_AE_MGMT_PORT:-18072}:18072"
    volumes:
      - ${APIM_LICENSE}:/opt/graviteeio-alert-engine/license/license.key:ro
    # AE's image healthcheck probes :8072 and gets 401 → the container would report
    # 'unhealthy' forever (a known false signal). Disable it so status isn't misleading;
    # AE health is judged from its logs / actual event flow, not this probe.
    healthcheck:
      disable: true
