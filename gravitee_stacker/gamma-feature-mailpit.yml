# Local SMTP capture (Mailpit) for the Gamma platform. Account flows that depend on email
# (registration, password reset, subscription notifications) are captured in the Mailpit web
# UI instead of going anywhere. SMTP :1025 stays internal; only the web UI is published
# (shifts with the instance offset).
services:
  gamma-mailpit:
    image: axllent/mailpit:v1.31.0
    restart: unless-stopped
    networks: [gamma]
    ports:
      - "${GAMMA_MAILPIT_PORT:-8027}:8025"
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1

  management_api:
    environment:
      - gravitee_email_enabled=true
      - gravitee_email_host=gamma-mailpit
      - gravitee_email_port=1025
      - gravitee_email_from=noreply@gravitee.local
      - gravitee_email_subject=[Gravitee.io] %s
